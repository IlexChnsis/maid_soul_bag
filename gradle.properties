# Gradle 运行参数。首次构建需要联网拉取 NeoForge / Minecraft / 依赖模组。
# NeoForge 的 createMinecraftArtifacts 要重编译 5000+ 个源文件，1G 堆偏紧，这里给 3G。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 本机需要代理才能访问 maven.neoforged.net 时取消下面四行注释（默认关闭，便于 CI 与全新环境）。
# 用 systemProp 而不是 JAVA_TOOL_OPTIONS：后者会向 fork 出的 javac 打印
# "Picked up JAVA_TOOL_OPTIONS"，混进 NeoForm 的诊断输出里。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
#systemProp.http.nonProxyHosts=localhost|127.0.0.1

# Parchment mappings (optional, only improves parameter names)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
# Matches the NeoForge version used by Touhou Little Maid 1.5.3 (21.1.219)
neo_version=21.1.219
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## Mod properties
mod_id=maid_soul_bag
mod_name=Maid Soul Bag
mod_license=MIT License
mod_version=1.3.1
mod_group_id=com.maidsoulbag
mod_authors=\u79be\u51ac\u9752
mod_description=A Curios accessory that stores soul spells and can release / recall maids in bulk.
mod_display_url=https://github.com/IlexChnsis/maid_soul_bag

